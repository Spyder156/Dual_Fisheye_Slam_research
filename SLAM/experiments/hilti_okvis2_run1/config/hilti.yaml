%YAML:1.0
cameras:
     # cam0 (T_SC = camera->IMU, inverse of Hilti T_cam_imu)
     - {T_SC:
        [0.0172144747722162, 0.9998263174555500, -0.0071412030913354, -0.0160047120886366,
         -0.0008034642120503, -0.0071284262145564, -0.9999742696614572, -0.0156241066694682,
         -0.9998514971252369, 0.0172197695390673, 0.0006806125511054, 0.0204109228995594,
         0.0000000000000000, 0.0000000000000000, 0.0000000000000000, 1.0000000000000000],
        image_dimension: [1472, 1440],
        distortion_coefficients: [0.025800718903376804, -0.010909240777406872, -0.0016899537986031076, 0.00014766801645260894],
        distortion_type: equidistant,
        focal_length: [465.3015482593691, 465.32303798346413],
        principal_point: [730.0455886686005, 720.1427007671206],
        camera_type: gray,
        slam_use: okvis}

     # cam1 (T_SC = camera->IMU, inverse of Hilti T_cam_imu)
     - {T_SC:
        [0.0011402115621430, 0.9999680618160726, 0.0079104529202894, -0.0146676009051166,
         0.0082939881547415, -0.0079196425876777, 0.9999342423488533, 0.0244024720356315,
         0.9999649542249397, -0.0010745273816893, -0.0083027533278687, 0.0195384086540889,
         0.0000000000000000, 0.0000000000000000, 0.0000000000000000, 1.0000000000000000],
        image_dimension: [1472, 1440],
        distortion_coefficients: [0.024723386256038673, -0.010754674082879279, -0.0016168993760219885, 0.00013675348254771203],
        distortion_type: equidistant,
        focal_length: [465.43630225493564, 465.4719940813323],
        principal_point: [733.436396975063, 718.7408714249976],
        camera_type: gray,
        slam_use: okvis}

camera_parameters:
    timestamp_tolerance: 0.005
    sync_cameras: [0, 1]
    image_delay: 0.0065711235601010635   # OKVIS2: t_corrected = t_cam - image_delay; Kalibr: t_imu = t_cam + timeshift(-0.00657) => +0.00657
    online_calibration:
        do_extrinsics: false            # Hilti L#2 saw extrinsics drift between runs; test later
        do_extrinsics_final_ba: false
        sigma_r: 0.01
        sigma_alpha: 0.1
        sigma_r_final_ba: 0.01
        sigma_alpha_final_ba: 0.5

imu_parameters:
    use: true
    a_max: 176.0
    g_max: 7.8
    sigma_g_c: 0.00047032046   # official Hilti gyro noise density
    sigma_a_c: 0.00285891188   # official Hilti accel noise density
    sigma_bg: 0.01
    sigma_ba: 0.1
    sigma_gw_c: 0.00036433633  # official Hilti gyro random walk
    sigma_aw_c: 0.00130039805  # official Hilti accel random walk
    g: 9.81007
    g0: [ 0.0, 0.0, 0.0 ]
    a0: [ 0.0, 0.0, 0.0 ]
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]

frontend_parameters:
    detection_threshold: 40.0
    absolute_threshold: 20.0
    matching_threshold: 60.0
    octaves: 0
    max_num_keypoints: 700
    keyframe_overlap: 0.55
    use_cnn: false
    parallelise_detection: true
    num_matching_threads: 4

estimator_parameters:
    num_keyframes: 5
    num_loop_closure_frames: 5
    num_imu_frames: 3
    do_loop_closures: true
    do_final_ba: true
    enforce_realtime: false
    realtime_min_iterations: 3
    realtime_max_iterations: 10
    realtime_time_limit: 0.035
    realtime_num_threads: 4
    full_graph_iterations: 15
    full_graph_num_threads: 2
    p_dbow: 0.4
    drift_percentage_heuristic: 1.35

output_parameters:
    display_matches: false
    display_overhead: false
